<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gudang Popok Bayi – Clearance Sale</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style id="css">
:root{--bg:#fff8f1;--card:#fff;--ink:#3b2f4a;--mute:#7a6d88;--line:#f0e2d6;--coral:#ff6b8b;--sun:#ffd166;--bad:#c62f55;color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif}
h1,h2,h3{font-family:"Baloo 2",system-ui,sans-serif;line-height:1.1;margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center}
.logo{font:800 22px "Baloo 2",sans-serif;white-space:nowrap}
.top input{flex:1;min-width:0;padding:10px 16px;border-radius:999px;border:0;font:inherit;background:#fff;color:var(--ink)}
.cartbtn{background:var(--sun);color:#3a2c00;border:0;border-radius:999px;padding:9px 16px;font-weight:800;white-space:nowrap}
.hero{position:relative;overflow:hidden;padding:36px 16px 28px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;z-index:0}
.hero::before{width:320px;height:320px;right:-80px;top:-100px;background:#d9f3e6}
.hero::after{width:220px;height:220px;left:-70px;bottom:-90px;background:#ffe3ea}
.hero-in{position:relative;z-index:1;max-width:1100px;margin:0 auto;display:grid;gap:14px;grid-template-columns:1.4fr 1fr;align-items:center}
.tag{display:inline-block;background:var(--coral);color:#fff;font-weight:800;border-radius:999px;padding:4px 14px;margin-bottom:10px}
.hero h1{font-size:clamp(32px,6vw,58px)}
.hero p{color:var(--mute);max-width:48ch;margin:10px 0 0}
.stats{display:grid;gap:8px}
.stat{background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px 16px;display:flex;align-items:center;gap:12px;font-weight:700}
.stat b{font:800 28px "Baloo 2",sans-serif;color:var(--coral);min-width:56px}
main{max-width:1100px;margin:0 auto;padding:0 16px 56px}
.cats,.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.cats a{text-decoration:none;color:var(--ink);font-weight:700;border-radius:999px;padding:6px 14px}
.chip{border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.sep{width:2px;background:var(--line);margin:0 2px}
.brand{margin-top:26px;scroll-margin-top:72px}
.bh{display:flex;justify-content:space-between;align-items:center;gap:8px;border-radius:20px 20px 0 0;padding:10px 18px}
.bh h2{font-size:24px}
.bh span{font-weight:700;font-size:14px;background:rgba(255,255,255,.65);border-radius:999px;padding:2px 12px}
.items{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));background:#fff;border:2px solid var(--line);border-top:0;border-radius:0 0 20px 20px;padding:12px}
.it{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:10px;background:var(--bg)}
.sz{flex:none;width:58px;height:58px;border-radius:14px;display:grid;place-items:center;font:800 18px "Baloo 2",sans-serif}
.inf{flex:1;min-width:0;display:grid}
.inf small{color:var(--mute);font-size:13px}
.stk{justify-self:start;margin-top:3px;border-radius:999px;padding:0 10px;font-size:12px;font-weight:800;background:#d9f3e6;color:#1d6b4a}
.stk.low{background:#ffe3ea;color:var(--bad)}
.pr{font:800 18px "Baloo 2",sans-serif;color:var(--coral);text-align:right}
.buy{display:grid;gap:4px;justify-items:end}
.add{border:0;background:var(--coral);color:#fff;border-radius:12px;padding:6px 14px;font-weight:800}
.step{display:flex;align-items:center;gap:6px}
.step button,.qty button{width:30px;height:30px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--ink);font-weight:800}
.empty{text-align:center;color:var(--mute);padding:48px 0}
.trust{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:36px}
.trust span{border-radius:999px;padding:8px 18px;font-weight:800}
footer{text-align:center;color:var(--mute);padding:8px 16px 40px;font-size:14px}
.scrim{position:fixed;inset:0;background:rgba(40,25,50,.5);display:none;z-index:20}
.scrim.on{display:block}
aside{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:#fff;z-index:21;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;padding:16px}
aside.on{transform:none}
@media (prefers-reduced-motion:reduce){aside{transition:none}html{scroll-behavior:auto}}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.x{border:0;background:none;color:var(--ink);font-size:30px;line-height:1}
#list{flex:1;overflow:auto;display:grid;gap:10px;align-content:start}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;border-bottom:2px solid var(--line);padding-bottom:10px}
.qty{display:flex;align-items:center;gap:8px}
.rm{border:0;background:none;color:var(--bad);font-weight:700;padding:0}
.tot{display:flex;justify-content:space-between;font:800 22px "Baloo 2",sans-serif;margin:10px 0}
form,#payBox{display:grid;gap:8px}
#payBox[hidden]{display:none}
label{font-weight:700;font-size:14px}
.f{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
.go{border:0;background:var(--coral);color:#fff;border-radius:14px;padding:12px;font-weight:800;font-size:17px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:0}
.meta{color:var(--mute);font-size:14px;margin:0}
.payinfo{white-space:pre-wrap;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px;font:700 15px Nunito,sans-serif;margin:0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 20px;font-weight:700;z-index:30;display:none}
@media (max-width:720px){.hero-in{grid-template-columns:1fr}.logo{font-size:18px}.stats{grid-template-columns:1fr 1fr}.stat{flex-direction:column;align-items:flex-start;gap:0}}

.bt{display:flex;align-items:center;gap:10px}
.bi{width:44px;height:44px;border-radius:12px;object-fit:cover;background:#fff}
#admBody{flex:1;min-height:0;overflow:auto;display:block;margin:8px 0}
#admBody>label,#admBody>h3{display:block;margin-top:12px}
#admBody>.f{display:block;margin-top:4px}
#admBody>textarea.f{min-height:84px}
.ab{flex:none}
.ab{border:2px solid var(--line);border-radius:14px;overflow:hidden;margin-top:8px}
.abh{padding:6px 12px}
.photo{padding:8px 12px;display:grid;gap:4px}
.sk{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;border-top:1px solid var(--line)}
.sk .f{width:64px;text-align:center;padding:6px}
.add:disabled{opacity:.5;cursor:not-allowed}
.sz{width:64px;height:64px;overflow:hidden}.pi{width:100%;height:100%;object-fit:cover}
.sk{flex-wrap:wrap}.skr{display:flex;align-items:center;gap:6px}.th{width:32px;height:32px;border-radius:8px;object-fit:cover}.ph{cursor:pointer;padding:2px 10px;font-size:13px}
.pl{display:flex;align-items:center;gap:4px;font-weight:700}.pz{width:104px;padding:6px}
.abh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.bk{display:flex;gap:6px;align-items:center}.bk .f{width:84px;padding:4px 8px}.bk .chip{padding:3px 10px;font-size:13px}
</style>
</head>
<body>
<div id="root"></div>
<template id="shell"><header class="top">
  <div class="logo">Gudang Popok Bayi</div>
  <input id="q" type="search" placeholder="Cari merek atau ukuran, misalnya “Makuku M”" aria-label="Cari produk">
  <button class="cartbtn" id="admBtn" hidden>Atur toko</button>
  <button class="cartbtn" id="openCart">Keranjang (<span id="cnt">0</span>)</button>
</header>

<section class="hero">
  <div class="hero-in">
    <div>
      <span class="tag">Clearance Sale · Stok Terbatas</span>
      <h1>Popok bayi berkualitas, harga miring.</h1>
      <p>Pilih merek dan ukuran yang pas untuk si kecil, masukkan ke keranjang, lalu kirim pesanan lewat WhatsApp. Tanpa daftar akun.</p>
    </div>
    <div class="stats">
      <div class="stat"><b id="sBrand">0</b>merek dan seri</div>
      <div class="stat"><b id="sItem">0</b>pilihan ukuran</div>
    </div>
  </div>
</section>

<main>
  <nav class="cats" id="cats" aria-label="Kategori merek"></nav>
  <div class="filters" id="filters" role="group" aria-label="Filter produk"></div>
  <div id="grid"></div>
  <div class="trust">
    <span style="background:#d9f3e6">Produk original</span>
    <span style="background:#ffe3ea">Harga lebih hemat</span>
    <span style="background:#fff0c2">Stok terbatas</span>
  </div>
</main>
<footer>© Gudang Popok Bayi. Harga dan stok dapat berubah sewaktu-waktu.</footer>

<aside id="adm" aria-label="Atur toko" aria-hidden="true">
  <div class="dh"><h2>Atur toko</h2><button class="x" id="closeAdm" aria-label="Tutup">×</button></div>
  <input class="f" id="admQ" type="search" placeholder="Cari SKU, misalnya “Makuku M”" aria-label="Cari SKU">
  <div id="admBody"></div>
  <p class="err" id="admErr" role="alert"></p>
  <button class="go" id="admSave" type="button">Simpan perubahan</button>
</aside>
<div class="scrim" id="scrim"></div>
<aside id="drawer" aria-label="Keranjang belanja" aria-hidden="true">
  <div class="dh"><h2>Keranjang</h2><button class="x" id="closeCart" aria-label="Tutup keranjang">×</button></div>
  <div id="list"></div>
  <div class="tot"><span>Total</span><span id="total">Rp0</span></div>
  <form id="co" novalidate>
    <label for="nm">Nama penerima</label><input class="f" id="nm" autocomplete="name">
    <label for="ad">Alamat lengkap</label><textarea class="f" id="ad" rows="3" autocomplete="street-address"></textarea>
    <p class="err" id="err" role="alert"></p>
    <button class="go" type="submit">Pesan lewat WhatsApp</button>
  </form>
  <div id="payBox" hidden>
    <h3>Pesanan terkirim ke WhatsApp</h3>
    <p class="meta">Tunggu konfirmasi stok dari toko. Setelah itu transfer ke:</p>
    <pre class="payinfo" id="payInfo"></pre>
    <p class="meta">Sudah transfer? Kirim bukti transfer (foto atau screenshot) ke WhatsApp toko.</p>
    <button class="go" id="payConfirm" type="button">Konfirmasi pembayaran</button>
    <button class="chip" id="payBack" type="button">Belanja lagi</button>
  </div>
</aside>
<div id="toast" role="status"></div></template>

<script id="app">
var FONT = "https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700&display=swap";
document.getElementById("root").appendChild(document.getElementById("shell").content.cloneNode(true));
var DATA = JSON.parse(document.getElementById("data").textContent);
var WA_NUMBER = DATA.wa;
var B = DATA.brands.map(function(b){ return [b.n,b.c,b.items.map(function(r){return [r.j,r.u,r.s,r.p,r.img||""];}),b.mk||0,b.img||"",b.items.map(function(r){return r.id;})]; });

var SIZES = ["NB","NB-S","S","M","L","XL","XXL","3XL"];
var rp = function(n){ return "Rp" + n.toLocaleString("id-ID"); };
var $ = function(id){ return document.getElementById(id); };
var items = [];
B.forEach(function(b,bi){ b[2].forEach(function(r,ri){
  var t = r[1].split(" ");
  items.push({id:b[5][ri], bi:bi, brand:b[0], color:b[1], jenis:r[0], tipe:r[0].indexOf("Perekat")===0?"Perekat":"Celana",
    size:t[0], isi:t.slice(1).join(" "), stok:r[2], img:r[4], price:r[3]+b[3]});
}); });
function byId(id){ for (var i=0;i<items.length;i++) if (items[i].id===id) return items[i]; }

var fT="Semua", fS="Semua", fLow=false, query="", cart={}, LAST=null, tt;
try { var sv = JSON.parse(localStorage.getItem("cart-gudang")||"{}"); Object.keys(sv).forEach(function(k){ var it=byId(k); if (it && sv[k]>0 && it.stok>0) cart[k]=Math.min(sv[k],it.stok); }); } catch(e){}
function persist(){ try { localStorage.setItem("cart-gudang", JSON.stringify(cart)); } catch(e){} }
function toast(m){ var t=$("toast"); t.textContent=m; t.style.display="block"; clearTimeout(tt); tt=setTimeout(function(){ t.style.display="none"; },1800); }

$("sBrand").textContent = B.length; $("sItem").textContent = items.length;
$("cats").innerHTML = B.map(function(b,i){ return '<a href="#b'+i+'" style="background:'+b[1]+'">'+b[0]+'</a>'; }).join("");

function renderFilters(){
  var h = ["Semua","Celana","Perekat"].map(function(t){ return '<button class="chip" data-t="'+t+'" aria-pressed="'+(t===fT)+'">'+(t==="Semua"?"Semua jenis":t)+'</button>'; }).join("");
  h += '<span class="sep"></span>';
  h += ["Semua"].concat(SIZES).map(function(s){ return '<button class="chip" data-s="'+s+'" aria-pressed="'+(s===fS)+'">'+(s==="Semua"?"Semua ukuran":s)+'</button>'; }).join("");
  h += '<span class="sep"></span><button class="chip" data-low="1" aria-pressed="'+fLow+'">Stok menipis</button>';
  $("filters").innerHTML = h;
}
$("filters").addEventListener("click", function(e){
  var b = e.target.closest("button"); if (!b) return;
  if (b.dataset.t) fT=b.dataset.t; if (b.dataset.s) fS=b.dataset.s; if (b.dataset.low) fLow=!fLow;
  renderFilters(); renderGrid();
});
$("q").addEventListener("input", function(e){ query=e.target.value.toLowerCase().trim(); renderGrid(); });

function card(it){
  var q = cart[it.id]||0;
  var act = it.stok<=0 ? '<button class="add" disabled>Habis</button>' : q ? '<div class="step"><button data-a="-" data-id="'+it.id+'" aria-label="Kurangi">−</button><b>'+q+'</b><button data-a="+" data-id="'+it.id+'" aria-label="Tambah">+</button></div>'
              : '<button class="add" data-a="+" data-id="'+it.id+'">Tambah</button>';
  var extra = it.jenis.replace(/^(Celana|Perekat)\s*/,"");
  return '<article class="it"><div class="sz" style="background:'+it.color+'">'+(it.img?'<img class="pi" src="'+it.img+'" alt="'+it.brand+' '+it.tipe+' '+it.size+'" loading="lazy">':it.size)+'</div><div class="inf"><b>'+it.tipe+' '+it.size+' · isi '+it.isi+'</b>'+
    (extra?'<small>'+extra+'</small>':'')+'<span class="stk'+(it.stok<=2?' low':'')+'">'+(it.stok<=0?'Habis':it.stok<=2?'Sisa '+it.stok:'Stok '+it.stok)+'</span></div>'+
    '<div class="buy"><div class="pr">'+rp(it.price)+'</div>'+act+'</div></article>';
}
function renderGrid(){
  var out = "";
  B.forEach(function(b,bi){
    var list = items.filter(function(it){
      return it.bi===bi && (fT==="Semua"||it.tipe===fT) && (fS==="Semua"||it.size===fS) && (!fLow||it.stok<=2) &&
        (!query || (it.brand+" "+it.jenis+" "+it.size+" "+it.isi).toLowerCase().indexOf(query)>-1);
    });
    if (!list.length) return;
    out += '<section class="brand" id="b'+bi+'"><div class="bh" style="background:'+b[1]+'"><div class=\"bt\">'+(b[4]?'<img class=\"bi\" src=\"/_blob/'+b[4]+'\" alt=\"\">':'')+'<h2>'+b[0]+'</h2></div><span>'+list.length+' pilihan</span></div><div class="items">'+list.map(card).join("")+'</div></section>';
  });
  $("grid").innerHTML = out || '<p class="empty">Tidak ada produk yang cocok. Coba ubah filter atau kata pencarian.</p>';
}
$("grid").addEventListener("click", function(e){
  var b = e.target.closest("button[data-a]"); if (!b) return; changeQty(b.dataset.id, b.dataset.a==="+"?1:-1);
});
function changeQty(id, d){
  var it = byId(id), q = (cart[id]||0)+d;
  if (q > it.stok){ toast("Stok tinggal "+it.stok+" pcs"); return; }
  if (q <= 0) delete cart[id]; else cart[id]=q;
  persist(); renderGrid(); renderCart();
}

function entries(){ return Object.keys(cart).map(function(id){ return [byId(id),cart[id]]; }).filter(function(a){ return a[0]; }); }
function renderCart(){
  var total=0, n=0, h="";
  entries().forEach(function(a){ var it=a[0], q=a[1]; total+=it.price*q; n+=q;
    h += '<div class="row"><strong>'+it.brand+' · '+it.jenis+' '+it.size+' ('+it.isi+')</strong><span>'+rp(it.price*q)+'</span>'+
      '<div class="qty"><button data-a="-" data-id="'+it.id+'" aria-label="Kurangi">−</button><span>'+q+'</span><button data-a="+" data-id="'+it.id+'" aria-label="Tambah">+</button></div>'+
      '<button class="rm" data-a="x" data-id="'+it.id+'">Hapus</button></div>'; });
  $("list").innerHTML = h || '<p class="meta">Keranjang masih kosong. Pilih popok dari daftar produk.</p>';
  $("total").textContent = rp(total); $("cnt").textContent = n;
}
$("list").addEventListener("click", function(e){
  var b = e.target.closest("button"); if (!b) return;
  if (b.dataset.a==="x"){ delete cart[b.dataset.id]; persist(); renderGrid(); renderCart(); }
  else changeQty(b.dataset.id, b.dataset.a==="+"?1:-1);
});

function drawer(on){ $("drawer").classList.toggle("on",on); $("scrim").classList.toggle("on",on); $("drawer").setAttribute("aria-hidden",on?"false":"true"); }
$("openCart").onclick = function(){ drawer(true); };
function closeAll(){ drawer(false); $("adm").classList.remove("on"); $("adm").setAttribute("aria-hidden","true"); }
$("closeCart").onclick = $("scrim").onclick = $("closeAdm").onclick = closeAll;
document.addEventListener("keydown", function(e){ if (e.key==="Escape") closeAll(); });

$("co").addEventListener("submit", function(e){
  e.preventDefault();
  var list = entries(), nm = $("nm").value.trim(), ad = $("ad").value.trim();
  if (!list.length){ $("err").textContent = "Keranjang masih kosong. Tambahkan produk dulu."; return; }
  if (!nm || !ad){ $("err").textContent = "Isi nama penerima dan alamat lengkap."; return; }
  $("err").textContent = "";
  var total=0, lines = list.map(function(a){ total+=a[0].price*a[1]; return "- "+a[0].brand+" "+a[0].jenis+" "+a[0].size+" ("+a[0].isi+") x"+a[1]+" = "+rp(a[0].price*a[1]); });
  var msg = "Halo, saya mau pesan:\n"+lines.join("\n")+"\nTotal: "+rp(total)+"\n\nNama: "+nm+"\nAlamat: "+ad;
  window.open("https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(msg), "_blank", "noopener");
  LAST = {nm:nm, total:total};
  $("payInfo").textContent = (DATA.pay||"").trim() || "Info pembayaran akan dikirim oleh toko lewat WhatsApp.";
  $("co").style.display = "none"; $("payBox").hidden = false;
});
$("payConfirm").onclick = function(){
  var m = "Halo, saya sudah transfer untuk pesanan atas nama "+(LAST?LAST.nm:"-")+" sebesar "+(LAST?rp(LAST.total):"-")+". Bukti transfer saya kirim di chat ini.";
  window.open("https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(m), "_blank", "noopener");
};
$("payBack").onclick = function(){
  cart = {}; persist(); LAST = null; renderGrid(); renderCart();
  $("co").style.display = ""; $("payBox").hidden = true; $("nm").value = ""; $("ad").value = ""; drawer(false);
};

renderFilters(); renderGrid(); renderCart();

  var h = '<label for="wa">Nomor WhatsApp toko (format 62…)</label><input class="f" id="wa" inputmode="numeric" value="'+esc(DRAFT.wa)+'">'+

  DRAFT.brands.forEach(function(b,bi){
    var rows = b.items.map(function(r,ri){

    }).join("");

  });

function setStok(inp, v){ v = Math.max(0, parseInt(v,10)||0); inp.value = v; DRAFT.brands[+inp.dataset.b].items[+inp.dataset.r].s = v; }

function toData(b){ return new Promise(function(ok,no){ var fr = new FileReader(); fr.onload = function(){ ok(fr.result); }; fr.onerror = no; fr.readAsDataURL(b); }); }
function shrink(f){
  return new Promise(function(ok){
    if (/svg|gif/.test(f.type)) return ok(f);
    var url = URL.createObjectURL(f), im = new Image();
    im.onload = function(){
      var s = Math.min(1, 600/Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = Math.round(im.width*s); c.height = Math.round(im.height*s);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(function(b){ ok(b || f); }, "image/jpeg", 0.8);
    };
    im.onerror = function(){ URL.revokeObjectURL(url); ok(f); };
    im.src = url;
  });
}
